<!--
title: Publications
description: Every paper from the MAIR Lab and William Mair, searchable and pulled from PubMed.
theme: light
scripts: pubs
-->
<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow">Publications</div>
    <h1 class="display">The <em>work.</em></h1>
    <p class="lede">Papers, reviews and preprints from the lab and from Will Mair’s earlier training, newest first. The list is generated from PubMed.</p>
  </div>
</section>

<section class="wrap" style="padding-bottom:120px">
  <div class="pub-tools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="pub-search" type="search" placeholder="Search title, author, journal or year" aria-label="Search publications">
    </label>
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" data-filter="lab" aria-pressed="false">Lab-led</button>
      <button class="chip" data-filter="review" aria-pressed="false">Reviews</button>
      <button class="chip" data-filter="preprint" aria-pressed="false">Preprints</button>
    </div>
  </div>
  <p class="pub-count" id="pub-count"></p>
  <div id="pub-list"></div>
</section>
